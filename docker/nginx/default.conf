server {
  listen 80;
  server_name pluto;

  location / {
    return 301 https://$server_name$request_uri;
  }
}

server {

  listen 443 ssl;
  server_name pluto;

  include snippets/pluto-cert.conf;
  include snippets/pluto-ssl-params.conf;

  include snippets/https-rules.conf;
}

server {
    listen 443 ssl;

    server_name pi.pluto;
 
    ssl_certificate /config/ssl/certs/pluto/pi.pluto.crt;
    ssl_certificate_key /config/ssl/certs/pluto/pi.pluto.key;
    
    include snippets/pluto-ssl-params.conf;

    location / {
        proxy_pass http://pihole:80;
        proxy_hide_header X-Frame-Options;
    }

    location /admin {
        proxy_pass http://pihole:80;
        proxy_hide_header X-Frame-Options;
    }
}

server {
    listen 443 ssl;

    server_name grafana.pluto;

    ssl_certificate /config/ssl/certs/pluto/grafana.pluto.crt;
    ssl_certificate_key /config/ssl/certs/pluto/grafana.pluto.key;
 
    include snippets/pluto-ssl-params.conf;
   
    client_max_body_size 0;

    location / {
        proxy_pass http://grafana:3000;
        proxy_set_header Host $http_host;
    }

    location ~ (/grafana)?/api {
        proxy_pass http://grafana:3000;
        proxy_set_header Host $http_host;
    }
}

server {
    listen 443 ssl;

    server_name jellyfin.pluto;

    ssl_certificate /config/ssl/certs/pluto/jellyfin.pluto.crt;
    ssl_certificate_key /config/ssl/certs/pluto/jellyfin.pluto.key;

    include snippets/pluto-ssl-params.conf;

    location / {
        if ($http_user_agent ~ Web0S) {
            add_header Access-Control-Allow-Origin "luna://com.webos.service.config" always;
        }
        proxy_pass http://jellyfin:8096;

        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
    }

    location ~ (/jellyfin)?/socket {
        if ($http_user_agent ~ Web0S) {
            add_header Access-Control-Allow-Origin "luna://com.webos.service.config" always;
        }
        proxy_pass http://jellyfin:8096;

    }

    location /metrics {
        allow 192.168.0.0/16;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 127.0.0.0/8;

        deny all;

        proxy_pass http://jellyfin:8096;
    }
}

server {
    listen 80;
    server_name jellyfin.pluto;

    location / {
        allow   192.168.1.0/24;
        deny    all;

        if ($http_user_agent ~ Web0S) {
            add_header Access-Control-Allow-Origin "luna://com.webos.service.config" always;
        }
        proxy_pass http://jellyfin:8096;

        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
    }

    location ~ (/jellyfin)?/socket {
        allow   192.168.1.0/24;
        deny    all;

        if ($http_user_agent ~ Web0S) {
            add_header Access-Control-Allow-Origin "luna://com.webos.service.config" always;
        }
        proxy_pass http://jellyfin:8096;

    }

    location /metrics {
        allow   192.168.1.0/24;
        deny    all;
        
        allow 192.168.0.0/16;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 127.0.0.0/8;

        deny all;

        proxy_pass http://jellyfin:8096;
    }
}

server {
    listen 443 ssl;

    server_name qbittorrent.pluto;

    ssl_certificate /config/ssl/certs/pluto/qbittorrent.pluto.crt;
    ssl_certificate_key /config/ssl/certs/pluto/qbittorrent.pluto.key;
    
    include snippets/pluto-ssl-params.conf;

    location / {
        proxy_pass http://qbittorrent:8090;
    }
}

server {
  listen 80;
  server_name sasoliveira.ddns.net sasoliveira.com;

  auth_basic           "sasoliveira";
  auth_basic_user_file /config/auth/.htpasswd;

  location /.well-known/acme-challenge/ {
    alias /etc/ssl/certs/challenges/;
    try_files $uri =404;
  }

  location / {
    return 301 https://$server_name$request_uri;
  }
}

server {

  listen 443 ssl;
  server_name sasoliveira.ddns.net;

  auth_basic           "sasoliveira";
  auth_basic_user_file /config/auth/.htpasswd;

  include snippets/sasoliveira.ddns.net-cert.conf;
  include snippets/sasoliveira.ddns.net-ssl-params.conf;

  include snippets/https-rules.conf;
}

server {

  listen 443 ssl;
  server_name sasoliveira.com;

  auth_basic           "sasoliveira";
  auth_basic_user_file /config/auth/.htpasswd;

  include snippets/sasoliveira.com-cert.conf;
  include snippets/sasoliveira.com-ssl-params.conf;

  include snippets/https-rules.conf;
}


