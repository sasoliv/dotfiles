server {
    listen 443 ssl;

    server_name filebrowser.pluto;

    ssl_certificate /config/ssl/certs/pluto/filebrowser.pluto.crt;
    ssl_certificate_key /config/ssl/certs/pluto/filebrowser.pluto.key;
    
    include snippets/pluto-ssl-params.conf;

    client_max_body_size 0;

    location / {
        proxy_pass http://filebrowser:80;
    }

    location ~ (/filebrowser)?/api/public {
